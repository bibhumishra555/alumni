<!-- profile.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alumni Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* profile.css */
    body {
      font-family: 'Arial', sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .profile-container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 800px;
      padding: 2rem;
    }

    .profile-header {
      text-align: center;
      border-bottom: 2px solid #eee;
      padding-bottom: 1.5rem;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #2c3e50;
      margin-bottom: 1rem;
    }

    .profile-info {
      margin-top: 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .info-card {
      background: #f8f9fa;
      padding: 1.5rem;
      border-radius: 10px;
      border-left: 4px solid #3498db;
    }

    .info-card h3 {
      color: #2c3e50;
      margin-bottom: 0.5rem;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin: 0.5rem 0;
      color: #34495e;
    }

    .edit-btn {
      background: #3498db;
      color: white;
      padding: 0.8rem 1.5rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 1.5rem;
      transition: all 0.3s ease;
    }

    .edit-btn:hover {
      background: #2980b9;
    }
  </style>
</head>
<body>
  <div class="profile-container">
    <div class="profile-header">
      <img src="https://i.pravatar.cc/150?img=3" class="avatar" alt="Profile Picture">
      <h1 id="full-name">Loading...</h1>
    </div>

    <div class="profile-info">
      <div class="info-card">
        <h3><i class="fas fa-graduation-cap"></i> Academic Info</h3>
        <div class="info-item">
          <i class="fas fa-book"></i>
          <span id="course">Loading...</span>
        </div>
        <div class="info-item">
          <i class="fas fa-calendar-alt"></i>
          <span id="batch">Loading...</span>
        </div>
        <div class="info-item">
          <i class="fas fa-id-card"></i>
          <span id="reg-number">Loading...</span>
        </div>
      </div>

      <div class="info-card">
        <h3><i class="fas fa-user-tie"></i> Professional Info</h3>
        <div class="info-item">
          <i class="fas fa-briefcase"></i>
          <span id="job">Loading...</span>
        </div>
        <div class="info-item">
          <i class="fas fa-map-marker-alt"></i>
          <span id="location">Loading...</span>
        </div>
      </div>

      <div class="info-card">
        <h3><i class="fas fa-envelope"></i> Contact Info</h3>
        <div class="info-item">
          <i class="fas fa-envelope"></i>
          <span id="email">Loading...</span>
        </div>
        <div class="info-item">
          <i class="fas fa-user-friends"></i>
          <span id="father-name">Loading...</span>
        </div>
      </div>
    </div>

    <button class="edit-btn" onclick="toggleEditModal()">Edit Profile</button>
  </div>

  <script>
    // profile.js
    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }

      try {
        const response = await fetch('http://localhost:5000/api/auth/user/me', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!response.ok) throw new Error('Failed to fetch profile');
        
        const userData = await response.json();
        
        // Update DOM with user data
        document.getElementById('full-name').textContent = userData.fullName;
        document.getElementById('email').textContent = userData.email;
        document.getElementById('course').textContent = userData.course;
        document.getElementById('batch').textContent = `Batch ${userData.batch}`;
        document.getElementById('reg-number').textContent = userData.registrationNumber;
        document.getElementById('job').textContent = userData.job || 'Not specified';
        document.getElementById('location').textContent = userData.location || 'Not specified';
        document.getElementById('father-name').textContent = userData.fatherName || 'Not specified';

      } catch (error) {
        console.error('Error:', error);
        alert('Failed to load profile data');
        window.location.href = 'login.html';
      }
    });

    function toggleEditModal() {
      // Implement edit modal logic
      alert('Edit profile functionality coming soon!');
    }
  </script>
</body>
</html>
