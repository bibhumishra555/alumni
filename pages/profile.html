<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alumni Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="profile-container">
    <div class="profile-header">
      <img src="https://i.pravatar.cc/150?img=3" class="avatar" alt="Profile Picture">
      <h1 id="full-name">Loading...</h1>
    </div>

    <div class="profile-info">
      <div class="info-card">
        <h3><i class="fas fa-graduation-cap"></i> Academic Info</h3>
        <div class="info-item"><i class="fas fa-book"></i><span id="course">Loading...</span></div>
        <div class="info-item"><i class="fas fa-calendar-alt"></i><span id="batch">Loading...</span></div>
        <div class="info-item"><i class="fas fa-id-card"></i><span id="reg-number">Loading...</span></div>
      </div>

      <div class="info-card">
        <h3><i class="fas fa-user-tie"></i> Professional Info</h3>
        <div class="info-item"><i class="fas fa-briefcase"></i><span id="job">Loading...</span></div>
        <div class="info-item"><i class="fas fa-map-marker-alt"></i><span id="location">Loading...</span></div>
      </div>

      <div class="info-card">
        <h3><i class="fas fa-envelope"></i> Contact Info</h3>
        <div class="info-item"><i class="fas fa-envelope"></i><span id="email">Loading...</span></div>
        <div class="info-item"><i class="fas fa-user-friends"></i><span id="father-name">Loading...</span></div>
      </div>
    </div>

    <button class="edit-btn" onclick="toggleEditModal()">Edit Profile</button>
  </div>

  <!-- Edit Modal -->
  <div id="edit-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Edit Profile</h2>
      <form id="edit-form">
        <label>Full Name: <input type="text" name="fullName"></label>
        <label>Email: <input type="email" name="email"></label>
        <label>Course: <input type="text" name="course"></label>
        <label>Batch: <input type="text" name="batch"></label>
        <label>Registration Number: <input type="text" name="registrationNumber"></label>
        <label>Job: <input type="text" name="job"></label>
        <label>Location: <input type="text" name="location"></label>
        <label>Father's Name: <input type="text" name="fatherName"></label>
        <div class="modal-buttons">
          <button type="submit">Save</button>
          <button type="button" onclick="toggleEditModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
