<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alumni Dashboard</title>
  <link rel="stylesheet" href="dashboard.css" />
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="dashboard">
    <aside id="sidebar" class="sidebar">
      <div class="logo">Alumni</div>
      <nav>
        <ul>
          <li class="active"><i class="fas fa-home"></i> Dashboard</li>
          <li><i class="fas fa-user"></i> Profile</li>
          <li><i class="fas fa-briefcase"></i> Jobs</li>
          <li><i class="fas fa-calendar"></i> Events</li>
          <li><i class="fas fa-users"></i> Network</li>
          <li><i class="fas fa-envelope"></i> Messages <span class="badge" id="msgBadge">0</span></li>
          <li><i class="fas fa-cog"></i> Settings</li>
        </ul>
      </nav>
      <div class="toggle-theme">
        <i class="fas fa-moon" id="themeToggle"></i>
      </div>
    </aside>

    <main>
      <header>
        <div class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></div>
        <div class="profile">
          <img src="https://i.pravatar.cc/40?img=3" alt="Profile" />
          <div class="notification" id="notifIcon">
            <i class="fas fa-bell"></i>
            <span id="notifCount">0</span>
            <div class="dropdown" id="notifDropdown">
              <p><strong>Notifications</strong></p>
              <ul id="notifList"></ul>
              <button id="markRead">Mark all as read</button>
            </div>
          </div>
        </div>
      </header>

      <section class="cards" id="cardsContainer">
        <!-- Cards populated by JS -->
      </section>

      <section class="activity">
        <h2>Recent Activity</h2>
        <ul id="activityFeed">
          <li>Loading activity...</li>
        </ul>
      </section>
    </main>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
