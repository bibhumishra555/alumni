<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignIn&SignUp</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Background Elements -->
        <div class="bg-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>

        <!-- Login Form -->
        <div class="form-container active" id="loginForm">
            <div class="form-header">
                <h2>Welcome Back</h2>
                <p>Sign in to your Alumni Portal</p>
            </div>
            
            <form id="loginFormElement" class="form">
                <div class="input-group">
                    <div class="input-wrapper">
                        <i class="fas fa-id-card"></i>
                        <input type="text" id="loginRegNo" placeholder="Registration Number" required>
                    </div>
                </div>
                
                <div class="input-group">
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="Password" required>
                        <i class="fas fa-eye toggle-password" onclick="togglePassword('loginPassword')"></i>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="rememberMe">
                        <span class="checkmark"></span>
                        Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>
                
                <button type="submit" class="btn btn-primary">
                    <span>Sign In</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
                
                <div class="form-footer">
                    <p>Don't have an account? <a href="#" onclick="switchToSignup()">Sign Up</a></p>
                </div>
            </form>
        </div>

        <!-- Signup Form -->
        <div class="form-container" id="signupForm">
            <div class="form-header">
                <h2>Join Our Alumni Network</h2>
                <p>Create your account to connect with fellow alumni</p>
            </div>
            
            <form id="signupFormElement" class="form">
                <div class="input-row">
                    <div class="input-group">
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input type="text" id="name" placeholder="Full Name" required>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <div class="input-wrapper">
                            <i class="fas fa-user-tie"></i>
                            <input type="text" id="fatherName" placeholder="Father's Name" required>
                        </div>
                    </div>
                </div>
                
                <div class="input-row">
                    <div class="input-group">
                        <div class="input-wrapper">
                            <i class="fas fa-graduation-cap"></i>
                            <select id="course" required>
                                <option value="">Select Course</option>
                                <option value="UG">Under Graduate (UG)</option>
                                <option value="PG">Post Graduate (PG)</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <div class="input-wrapper">
                            <i class="fas fa-building"></i>
                            <select id="department" required disabled>
                                <option value="">Select Department</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="input-row">
                    <div class="input-group">
                        <div class="input-wrapper">
                            <i class="fas fa-id-badge"></i>
                            <input type="text" id="regNumber" placeholder="Registration Number" required>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <div class="input-wrapper">
                            <i class="fas fa-calendar"></i>
                       <input type="number" id="signupPassingYear" class="form-input" placeholder="YYYY" min="1970" max="2025" required>
                    <span class="input-icon">📅</span>
                        </div>
                    </div>
                </div>
                
                <div class="input-group">
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="signupPassword" placeholder="Create Password" required>
                        <i class="fas fa-eye toggle-password" onclick="togglePassword('signupPassword')"></i>
                    </div>
                </div>
                
                <div class="input-group">
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                        <i class="fas fa-eye toggle-password" onclick="togglePassword('confirmPassword')"></i>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="agreeTerms" required>
                        <span class="checkmark"></span>
                        I agree to the <a href="#">Terms & Conditions</a>
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary">
                    <span>Create Account</span>
                    <i class="fas fa-user-plus"></i>
                </button>
                
                <div class="form-footer">
                    <p>Already have an account? <a href="#" onclick="switchToLogin()">Sign In</a></p>
                </div>
            </form>
        </div>
    </div>

    <!-- Success/Error Messages -->
    <div class="message-container" id="messageContainer">
        <div class="message" id="message">
            <i class="fas fa-check-circle"></i>
            <span id="messageText"></span>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
